name: Build Android Client

on:
  push:
    paths:
      - 'trusttunnel-android/**'
      - 'platform/android/lib/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'trusttunnel-android/**'
      - 'platform/android/lib/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12.0
          accept-android-sdk-licenses: true
          packages: |
            android-35
            build-tools;35.0.0
            ndk;28.1.13356709

      - name: Build debug APK
        working-directory: trusttunnel-android
        run: ./gradlew assembleDebug

      - name: Build release APK
        working-directory: trusttunnel-android
        run: ./gradlew assembleRelease

      - name: Build release AAB
        working-directory: trusttunnel-android
        run: ./gradlew bundleRelease

      - name: Run unit tests
        working-directory: trusttunnel-android
        run: ./gradlew test

      - name: Run lint
        working-directory: trusttunnel-android
        run: ./gradlew lint

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: trusttunnel-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-release
          path: trusttunnel-android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-release-bundle
          path: trusttunnel-android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: trusttunnel-android/app/build/reports/lint-results.html
