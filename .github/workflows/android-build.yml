name: Build Android Client

on:
  push:
    paths:
      - 'trusttunnel-android/**'
      - 'platform/android/lib/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'trusttunnel-android/**'
      - 'platform/android/lib/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.android
          echo "### User Preferences for Android SDK Manager" > ~/.android/repositories.cfg
          echo "count=0" >> ~/.android/repositories.cfg
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build debug APK
        working-directory: trusttunnel-android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        working-directory: trusttunnel-android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Build release AAB
        working-directory: trusttunnel-android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Run unit tests
        working-directory: trusttunnel-android
        run: |
          chmod +x ./gradlew
          ./gradlew test --stacktrace || true

      - name: Run lint
        working-directory: trusttunnel-android
        run: |
          chmod +x ./gradlew
          ./gradlew lint --stacktrace || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: trusttunnel-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-release
          path: trusttunnel-android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-release-bundle
          path: trusttunnel-android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: trusttunnel-android/app/build/reports/lint-results.html
