name: Build Android Client

on:
  push:
    paths:
      - 'trusttunnel-android/**'
      - 'platform/android/**'
      - 'trusttunnel/**'
      - 'core/**'
      - 'common/**'
      - 'net/**'
      - 'tcpip/**'
      - 'conanfile.py'
      - 'conandata.yml'
      - 'scripts/bootstrap_conan_deps.py'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'trusttunnel-android/**'
      - 'platform/android/**'
      - 'trusttunnel/**'
      - 'core/**'
      - 'common/**'
      - 'net/**'
      - 'tcpip/**'
      - 'conanfile.py'
      - 'conandata.yml'
      - 'scripts/bootstrap_conan_deps.py'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

env:
  CONAN_VER: "2.12"
  NDK_VERSION: "28.1.13356709"

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Conan + PyYAML
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "pyyaml>=6.0.3" conan~=${CONAN_VER}

      - name: Cache Conan packages
        uses: actions/cache@v4
        id: conan-cache
        with:
          path: ~/.conan2/
          key: android-conan2-v1-${{ hashFiles('conanfile.py') }}
          restore-keys: android-conan2-v1-

      - name: Cache cargo registry + cargo-ndk binary
        uses: actions/cache@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
          key: android-cargo-v1-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: android-cargo-v1-

      - name: Set up Rust + cargo-ndk
        run: |
          # Add Android targets to the project toolchain (1.85 from rust-toolchain.toml).
          rustup target add aarch64-linux-android x86_64-linux-android
          # Also add to the system stable toolchain.  quiche has no
          # rust-toolchain.toml in its source tree, so when cargo runs inside
          # ~/.conan2/.../quiche/ it falls back to the DEFAULT stable toolchain,
          # not the project-pinned 1.85.  Without this the build fails with
          # "can't find crate for `core`" for aarch64-linux-android.
          rustup target add aarch64-linux-android x86_64-linux-android --toolchain stable
          # Install cargo-ndk only on cache miss — on a hit the binary is already
          # restored from cache above, so we skip the compilation (saves ~3 min).
          # Pin to 3.5.4 — the latest version compatible with rustc 1.85
          # (rust-toolchain.toml pins the project to 1.85; cargo-ndk 4.x needs 1.86+)
          if [[ "${{ steps.cargo-cache.outputs.cache-hit }}" != "true" ]]; then
            cargo install cargo-ndk@3.5.4 --locked
          fi

      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.android
          echo "### User Preferences for Android SDK Manager" > ~/.android/repositories.cfg
          echo "count=0" >> ~/.android/repositories.cfg
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> $GITHUB_ENV
          # Override ANDROID_NDK_ROOT as well — the runner pre-sets this to the
          # bundled NDK 27, but cargo-ndk reads ANDROID_NDK_ROOT first and warns
          # (or errors) when it doesn't match ANDROID_NDK_HOME.
          # IMPORTANT: this must happen BEFORE Bootstrap Conan so that quiche's
          # cargo-ndk invocation already sees the correct NDK path.
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> $GITHUB_ENV

      - name: Bootstrap Conan dependencies
        run: python3 ./scripts/bootstrap_conan_deps.py

      - name: Point AGP at the system CMake (>= 3.24)
        run: |
          # The Android SDK only ships cmake up to 3.22.1, but our CMakeLists.txt
          # files require cmake >= 3.24.  Setting cmake.dir in local.properties
          # tells AGP to use the system cmake binary and ignores the version field
          # in build.gradle.kts.  ubuntu-latest ships cmake 3.28+.
          CMAKE_BIN=$(which cmake)
          CMAKE_INSTALL_ROOT=$(dirname "${CMAKE_BIN}")/..
          echo "Using system cmake: $(cmake --version | head -1) at ${CMAKE_BIN}"
          echo "cmake.dir=${CMAKE_INSTALL_ROOT}" >> trusttunnel-android/local.properties
          # Ensure ninja is also available (needed by CMake in Android builds)
          which ninja || sudo apt-get install -y ninja-build

      - name: Build debug APK
        working-directory: trusttunnel-android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        working-directory: trusttunnel-android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Build release AAB
        working-directory: trusttunnel-android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Run unit tests
        working-directory: trusttunnel-android
        run: |
          chmod +x ./gradlew
          ./gradlew test --stacktrace || true

      - name: Run lint
        working-directory: trusttunnel-android
        run: |
          chmod +x ./gradlew
          ./gradlew lint --stacktrace || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: trusttunnel-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-release
          path: trusttunnel-android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-release-bundle
          path: trusttunnel-android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: trusttunnel-android/app/build/reports/lint-results.html
